services:
  postgres:
    image: postgres:16-alpine
    container_name: labels-mis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: labels_mis
      POSTGRES_USER: labels_mis
      POSTGRES_PASSWORD: dev_password_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labels_mis"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
